# ── Worker processes ──────────────────────────────────────────
# auto = one worker per CPU core.
worker_processes auto;

events {
    # Max simultaneous connections per worker.
    # 1024 is plenty for a single-user self-hosted setup.
    worker_connections 1024;
}

http {
    # ── MIME types ────────────────────────────────────────────
    # Without this, nginx serves .js/.css as text/plain and browsers
    # refuse to execute them, causing a blank white page.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ── Gzip compression ──────────────────────────────────────
    # Compresses text assets (JS, CSS, JSON, HTML) before sending.
    # Reduces bandwidth by 60-80% for typical web app payloads.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Upstream services ──────────────────────────────────────
    # Service names must match the `service` names in docker-compose.yml.
    upstream api { server api:8000; }
    upstream web { server web:80;   }

    # ── Main server ────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security headers ─────────────────────────────────
        # Prevents clickjacking, XSS, and MIME-type sniffing attacks.
        add_header X-Frame-Options        "SAMEORIGIN"     always;
        add_header X-XSS-Protection       "1; mode=block"  always;
        add_header X-Content-Type-Options "nosniff"        always;
        add_header Referrer-Policy        "same-origin"    always;

        # ── Client body size ─────────────────────────────────
        # Allows uploading reasonable files (e.g. settings imports).
        # Audio files themselves are never uploaded; they stream from YouTube.
        client_max_body_size 16M;

        # ── Proxy headers applied to every proxied request ───
        # Without these, the FastAPI app sees every request as coming from
        # 127.0.0.1 (nginx), not the real client IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── API routes ────────────────────────────────────────
        # Proxy /api/* and /api (without trailing slash — both must match).
        location /api {
            proxy_pass http://api;

            # Stream audio chunks to the browser as they arrive from yt-dlp
            # instead of buffering the whole response first (which would
            # cause a long silence before playback starts).
            proxy_buffering off;

            # Increase timeouts for long-running requests like downloads
            # and stream pre-warming (default 60s is too short).
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_connect_timeout 10s;
        }

        # ── Socket.IO (WebSocket upgrade) ────────────────────
        # Must be a separate location block because WebSocket connections
        # need the Upgrade/Connection headers set explicitly — the /api
        # block above doesn't set them.
        location /socket.io {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;   # keep WS connections alive
        }

        # ── Frontend SPA ──────────────────────────────────────
        # For everything that isn't /api or /socket.io, serve the React
        # app. The trailing / on proxy_pass strips the matched prefix before
        # forwarding, so the web container always receives requests at /.
        location / {
            proxy_pass http://web/;
        }
    }
}