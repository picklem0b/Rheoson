<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0a1f"/>
      <stop offset="0.55" stop-color="#14070f"/>
      <stop offset="1" stop-color="#050305"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="48%">
      <stop offset="0" stop-color="#ff2d78" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2d78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a37f"/>
      <stop offset="1" stop-color="#b9805c"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a45"/>
      <stop offset="1" stop-color="#1b1222"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#bg)"/>
  <rect width="800" height="1200" fill="url(#glow)"/>
  <!-- floating notes -->
  <g fill="#ff2d78" opacity="0.8">
    <g transform="translate(120 250) rotate(-14)"><ellipse cx="0" cy="40" rx="18" ry="13"/><rect x="14" y="-30" width="5" height="70"/><path d="M19 -30 q28 6 24 34 q-10 -16 -24 -14z"/></g>
    <g transform="translate(640 200) rotate(10) scale(1.3)" opacity="0.7"><ellipse cx="0" cy="40" rx="18" ry="13"/><rect x="14" y="-30" width="5" height="70"/><path d="M19 -30 q28 6 24 34 q-10 -16 -24 -14z"/></g>
    <g transform="translate(690 470) rotate(-8) scale(0.9)" opacity="0.55"><ellipse cx="0" cy="40" rx="18" ry="13"/><rect x="14" y="-30" width="5" height="70"/></g>
    <g transform="translate(90 560) rotate(18) scale(1.1)" opacity="0.5"><ellipse cx="0" cy="40" rx="18" ry="13"/><rect x="14" y="-30" width="5" height="70"/></g>
  </g>
  <!-- sound rings -->
  <g fill="none" stroke="#ff2d78" stroke-width="3" opacity="0.28">
    <circle cx="400" cy="470" r="250"/><circle cx="400" cy="470" r="320"/><circle cx="400" cy="470" r="390"/>
  </g>
  <!-- shoulders / hoodie -->
  <path d="M60 1200 C 70 930 190 800 400 790 C 610 800 730 930 740 1200 Z" fill="url(#hood)"/>
  <!-- neck -->
  <rect x="352" y="640" width="96" height="170" rx="40" fill="url(#skin)"/>
  <!-- head -->
  <ellipse cx="400" cy="500" rx="150" ry="180" fill="url(#skin)"/>
  <!-- hair -->
  <path d="M248 480 C 230 300 330 250 410 252 C 500 254 575 310 552 480 C 540 410 500 372 400 372 C 300 372 262 410 248 480 Z" fill="#150c12"/>
  <!-- closed eyes (listening) -->
  <path d="M335 505 q27 20 54 0" fill="none" stroke="#2a1713" stroke-width="7" stroke-linecap="round"/>
  <path d="M411 505 q27 20 54 0" fill="none" stroke="#2a1713" stroke-width="7" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M355 590 q45 38 90 0" fill="none" stroke="#7a3b2e" stroke-width="8" stroke-linecap="round"/>
  <!-- headphones -->
  <path d="M236 500 C 226 300 322 226 400 226 C 478 226 574 300 564 500" fill="none" stroke="#ff2d78" stroke-width="22" stroke-linecap="round"/>
  <rect x="204" y="450" width="64" height="150" rx="30" fill="#ff2d78"/>
  <rect x="532" y="450" width="64" height="150" rx="30" fill="#ff2d78"/>
  <rect x="216" y="468" width="30" height="114" rx="15" fill="#c71a58"/>
  <rect x="554" y="468" width="30" height="114" rx="15" fill="#c71a58"/>
  <!-- bottom fade so text stays readable -->
  <rect y="700" width="800" height="500" fill="#050305" opacity="0.0"/>
</svg>
