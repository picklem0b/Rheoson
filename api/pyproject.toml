[project]
name = "shulker-api"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.0",
    "httpx==0.27.0",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
    "celery[redis]==5.4.0",
    "redis==5.0.4",
    "mutagen==1.47.0",
    "pillow>=11.0.0",
    "python-socketio==5.11.2",
    "structlog==24.2.0",
    "rich>=13.9.4,<14",
    "spotdl==4.5.0",
    "yt-dlp",
    "spotipy",
    "beautifulsoup4",
    "jinja2>=3.1.5",
    "platformdirs>=4.3.6,<5",
    "python-slugify[unidecode]>=8.0.4,<9",
    "rapidfuzz>=3.10.1,<4",
    "syncedlyrics>=1.0.1,<2",
    "websockets~=14.1",
    "ytmusicapi>=1.12.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "black",
    "isort",
    "pyflakes",
    "mypy==1.10.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"