name: Build Rheoson APK

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: apk-build
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.13'

            - name: Install API dependencies
              working-directory: api
              run: |
                  pip install uv
                  uv sync

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install web dependencies
              working-directory: web
              run: npm ci

            - name: Build Vite app
              working-directory: web
              env:
                  # Fix: was "${{ secrets.VITE_API_URL }} }}" — double closing brace
                  # caused the env block to be silently ignored in GitHub Actions.
                  VITE_API_URL: ${{ secrets.VITE_API_URL }}
                  # Baked into the bundle at build time. Without it the APK ships
                  # a local-mode bundle: no ClerkProvider mounts, and every
                  # useUser()/useAuth() call crashes with "can only be used
                  # within <ClerkProvider />" (the web/app.err crash).
                  VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
                  # NODE_ENV=production keeps the bundle out of dev mode so the
                  # API base is resolved from the origin instead of the Vite
                  # proxy path.
                  NODE_ENV: production
              run: npm run build

            # Fails the build if the bundle ended up with a relative /api.
            # That is the failure mode that shipped once already: inside the
            # WebView /api is answered by the asset handler with index.html,
            # so every request dies as "Backend returned HTML instead of JSON".
            # A missing VITE_API_URL secret now falls back to the canonical
            # origin *and* is caught here before the APK is packaged.
            - name: Verify API origin was baked in
              working-directory: web
              env:
                  VITE_API_URL: ${{ secrets.VITE_API_URL }}
              run: npm run verify:api-base

            - name: Sync Capacitor
              working-directory: web
              run: npx cap sync android

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: 'platforms;android-35 build-tools;35.0.0'

            - name: Make gradlew executable
              working-directory: web/android
              run: chmod +x gradlew

            # Debug build — no keystore needed, APK is immediately installable
            # via adb or direct file transfer. The JS bundle is production-optimised
            # (NODE_ENV=production above) even though the APK variant is debug.
            - name: Build debug APK
              working-directory: web/android
              run: ./gradlew assembleDebug

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Rheoson-debug
                  path: web/android/app/build/outputs/apk/debug/app-debug.apk
                  retention-days: 30
