name: Build Shulker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: web
        run: npm install --include=dev

      - name: Build Vite app
        working-directory: web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }} }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: web
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }} }}
        run: echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > /home/runner/shulker-release.keystore

      - name: Make gradlew executable
        working-directory: web/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: web/android
        env:
          KEYSTORE_PATH: /home/runner/shulker-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }} }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }} }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }} }}
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shulker-release
          path: web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
