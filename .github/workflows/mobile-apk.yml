name: Mobile APK

# Builds the Expo app's APK on a GitHub runner instead of EAS.
#
# EAS still owns the release channel — the `preview` profile is what the phone
# installs, and the keystore EAS manages is what signed the installed app. This
# workflow exists so a build does not have to wait on EAS build credits.
#
# What it produces is an ordinary release APK. Whether it can install *over*
# the app already on the phone is a signing question, not a build one:
#
#   * `RHEOSON_KEYSTORE_B64` (+ password / alias / key password) secrets set:
#     the APK is signed with that key. Export the EAS-managed keystore once
#     (`eas credentials` → Android → Download keystore) and CI builds become
#     in-place upgrades.
#   * secrets absent: Gradle's default debug key. That installs on a phone with
#     no Rheoson app, or after uninstalling the EAS one — Android refuses a
#     signature change as an update.

on:
   workflow_dispatch:
      inputs:
         api_url:
            description: 'API origin baked into the bundle (blank = Render backend)'
            required: false
            default: ''
         version_code:
            description: 'Android versionCode override — must be >= the installed build'
            required: false
            default: ''
         variant:
            description: 'Build variant'
            type: choice
            options: [release, debug]
            default: release
   push:
      branches: [main, experiment/mobile]
      paths:
         - 'apps/mobile/**'
         - 'packages/api-types/**'
         - 'pnpm-lock.yaml'
         - 'pnpm-workspace.yaml'
         - '.github/workflows/mobile-apk.yml'

concurrency:
   group: mobile-apk-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read

jobs:
   apk:
      name: Build ${{ inputs.variant || 'release' }} APK
      runs-on: ubuntu-latest
      timeout-minutes: 60

      env:
         CI: 'true'
         EXPO_NO_TELEMETRY: '1'
         VARIANT: ${{ inputs.variant || 'release' }}
         EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://rheoson-api-9e4c.onrender.com' }}
         RHEOSON_VERSION_CODE: ${{ inputs.version_code }}
         RHEOSON_KEYSTORE_B64: ${{ secrets.RHEOSON_KEYSTORE_B64 }}
         RHEOSON_KEYSTORE_PASSWORD: ${{ secrets.RHEOSON_KEYSTORE_PASSWORD }}
         RHEOSON_KEY_ALIAS: ${{ secrets.RHEOSON_KEY_ALIAS }}
         RHEOSON_KEY_PASSWORD: ${{ secrets.RHEOSON_KEY_PASSWORD }}

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Set up pnpm
           uses: pnpm/action-setup@v4
           with:
              version: 9.12.0
              run_install: false

         - name: Set up Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         # The same three gates the branch has to pass anyway. They run first so
         # a broken TypeScript build never spends 20 minutes in Gradle.
         - name: Typecheck
           run: pnpm --filter @rheoson/mobile typecheck

         - name: Unit tests
           run: pnpm --filter @rheoson/mobile test

         - name: Lint
           run: pnpm --filter @rheoson/mobile lint

         # React Native 0.76 / AGP 8.6 targets JDK 17. Java 21 works for AGP but
         # not reliably for the Kotlin 1.9.24 this app pins.
         - name: Set up Java 17
           uses: actions/setup-java@v4
           with:
              distribution: temurin
              java-version: '17'

         # NDK 26.1.10909125 is the one `expo prebuild` writes into the root
         # build.gradle; leaving it out makes the runner download it mid-build
         # (or fail outright when the licences are not accepted).
         - name: Set up Android SDK
           uses: android-actions/setup-android@v3
           with:
              packages: 'platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1'

         # Must run before prebuild: `plugins/withReleaseSigning` reads these
         # variables while the native project is generated.
         - name: Stage release keystore
           if: env.RHEOSON_KEYSTORE_B64 != ''
           run: |
              set -euo pipefail
              printf '%s' "$RHEOSON_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rheoson-release.keystore"
              echo "RHEOSON_KEYSTORE_PATH=$RUNNER_TEMP/rheoson-release.keystore" >> "$GITHUB_ENV"
              echo "Release signing: **on** (alias \`${RHEOSON_KEY_ALIAS}\`, checked against the APK certificate)." >> "$GITHUB_STEP_SUMMARY"

         - name: No signing keystore
           if: env.RHEOSON_KEYSTORE_B64 == ''
           run: |
              echo "Release signing: **off** — the APK will carry Gradle's debug key." >> "$GITHUB_STEP_SUMMARY"
              echo "Set RHEOSON_KEYSTORE_B64 / _PASSWORD / _KEY_ALIAS / _KEY_PASSWORD to sign it instead." >> "$GITHUB_STEP_SUMMARY"

         - name: Prebuild Android project
           working-directory: apps/mobile
           run: npx expo prebuild --platform android --no-install --clean

         - name: Apply versionCode override
           if: env.RHEOSON_VERSION_CODE != ''
           working-directory: apps/mobile
           run: |
              set -euo pipefail
              sed -i "s/versionCode [0-9]\+/versionCode ${RHEOSON_VERSION_CODE}/" android/app/build.gradle
              grep -q "versionCode ${RHEOSON_VERSION_CODE}" android/app/build.gradle
              echo "versionCode → ${RHEOSON_VERSION_CODE}" >> "$GITHUB_STEP_SUMMARY"

         # Cached after prebuild, so the key hashes the generated Gradle files.
         - name: Cache Gradle
           uses: actions/cache@v4
           with:
              path: |
                 ~/.gradle/caches
                 ~/.gradle/wrapper
                 ~/.gradle/native
              key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/build.gradle', 'apps/mobile/android/app/build.gradle') }}
              restore-keys: |
                 gradle-${{ runner.os }}-

         - name: Build APK
           working-directory: apps/mobile/android
           run: |
              set -euo pipefail
              # The template ships a 2 GB heap. R8 + dex over expo-modules needs
              # more than that, and an OOM here reads as a mystifying Kotlin DAC.
              sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
              chmod +x gradlew
              task=assembleRelease
              if [ "$VARIANT" = "debug" ]; then task=assembleDebug; fi
              ./gradlew --no-daemon "$task"

         # Proves the artifact is what it claims to be: the versionCode Android
         # will compare against the installed build, and the certificate inside.
         # Resolved first, because the output name is Gradle's choice, not ours.
         - name: Locate APK
           id: apk
           working-directory: apps/mobile/android
           run: |
              set -euo pipefail
              expected="app/build/outputs/apk/${VARIANT}/app-${VARIANT}.apk"
              if [ -f "$expected" ]; then
                 apk="$expected"
              else
                 apk="$(find app/build/outputs -name '*.apk' -print -quit)"
              fi
              if [ -z "$apk" ] || [ ! -f "$apk" ]; then
                 echo "::error::No APK under app/build/outputs for variant ${VARIANT}"
                 find app/build/outputs -name '*.apk' -print || true
                 exit 1
              fi
              echo "path=$apk" >> "$GITHUB_OUTPUT"
              echo "::notice::APK at ${apk} ($(du -h "$apk" | cut -f1))"

         # `::error::` on every branch so a failure explains itself in the
         # annotations — the run log itself needs a signed-in browser.
         - name: Verify APK
           working-directory: apps/mobile/android
           env:
              APK: ${{ steps.apk.outputs.path }}
           run: |
              set -euo pipefail
              sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
              if [ -z "$sdk" ]; then
                 echo "::error::Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set"
                 exit 1
              fi
              build_tools="$(ls -d "$sdk"/build-tools/* | sort -V | tail -1)"
              echo "::notice::build-tools ${build_tools}"

              if ! "$build_tools/aapt2" dump badging "$APK" > badging.txt 2>&1; then
                 echo "::error::aapt2 dump badging failed: $(head -3 badging.txt | tr '\n' ' ')"
                 exit 1
              fi
              grep -E '^package:|^sdkVersion|^targetSdkVersion|^application-label:' badging.txt \
                 | sed 's/^/::notice::/' || true

              if ! "$build_tools/apksigner" verify --print-certs "$APK" > certs.txt 2>&1; then
                 echo "::error::apksigner verify failed — the APK is not correctly signed: $(head -3 certs.txt | tr '\n' ' ')"
                 exit 1
              fi
              grep -E 'certificate (DN|SHA-256 digest):' certs.txt | sed 's/^/::notice::/' || true

              # A signing config that prebuild silently dropped builds and
              # verifies fine — it just carries the debug key, and the phone
              # refuses the install. When a keystore was staged, prove the APK
              # actually used it instead of trusting the generated Gradle file.
              # apksigner's wording moves with the build-tools version:
              # `Signer #1 certificate DN:` on older ones, `V2 Signer:
              # certificate DN:` on newer. Match whatever precedes the label
              # rather than pinning one prefix.
              cert_dn="$(sed -n 's/.*certificate DN: *//p' certs.txt | head -1)"
              cert_sha="$(sed -n 's/.*certificate SHA-256 digest: *//p' certs.txt | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
              if [ -z "$cert_dn" ]; then
                 # apksigner's wording is not a contract; an unreadable
                 # certificate is a warning, not a failed build. The full output
                 # is copied into the annotations so the format is visible
                 # without opening the log.
                 echo "::warning::Could not parse a signer certificate from apksigner output"
                 head -8 certs.txt | sed 's/^/::notice::/'
              elif [ -n "${RHEOSON_KEYSTORE_PATH:-}" ]; then
                 case "$cert_dn" in
                    *'Android Debug'*)
                       echo "::error::APK is signed with Gradle's debug key although a keystore was staged — the release signing config was not applied"
                       exit 1
                       ;;
                 esac
                 # `SHA256:` on some JDKs, `SHA-256:` on others; `|| true` so a
                 # bad alias or password reaches the readable error below
                 # instead of dying silently under `set -e`.
                 expected="$({ keytool -list -v -keystore "$RHEOSON_KEYSTORE_PATH" -alias "${RHEOSON_KEY_ALIAS:-}" -storepass "${RHEOSON_KEYSTORE_PASSWORD:-}" 2>&1 || true; } | sed -n 's/.*SHA-\{0,1\}256: *//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
                 if [ -z "$expected" ]; then
                    echo "::error::Could not read a SHA-256 from the staged keystore (wrong alias or keystore password?)"
                    { keytool -list -v -keystore "$RHEOSON_KEYSTORE_PATH" -alias "${RHEOSON_KEY_ALIAS:-}" -storepass "${RHEOSON_KEYSTORE_PASSWORD:-}" 2>&1 || true; } | head -5 | sed 's/^/::error::/'
                    exit 1
                 fi
                 if [ -z "$cert_sha" ]; then
                    echo "::warning::Could not parse the APK certificate digest; skipped the keystore comparison"
                    head -8 certs.txt | sed 's/^/::notice::/'
                 elif [ "$expected" != "$cert_sha" ]; then
                    echo "::error::APK certificate ${cert_sha} does not match the keystore's ${expected}"
                    exit 1
                 else
                    echo "::notice::APK signed by the staged keystore (SHA-256 ${cert_sha})"
                 fi
              fi

              {
                 echo "#### Badging"
                 echo '```'
                 grep -E '^package:|^sdkVersion|^targetSdkVersion|^application-label:' badging.txt || cat badging.txt
                 echo '```'
                 echo "#### Signing"
                 echo '```'
                 grep -E 'certificate (DN|SHA-256 digest):' certs.txt || cat certs.txt
                 echo '```'
              } >> "$GITHUB_STEP_SUMMARY"

         - name: Collect artifact
           id: collect
           working-directory: apps/mobile
           env:
              APK: ${{ steps.apk.outputs.path }}
           run: |
              set -euo pipefail
              version="$(node -p "require('./app.json').expo.version")"
              code="$(sed -n 's/.*versionCode \([0-9]\+\)/\1/p' android/app/build.gradle | head -1)"
              if [ -n "${RHEOSON_KEYSTORE_PATH:-}" ]; then signing=release-signed; else signing=debug-key; fi
              out="Rheoson-${version}-${code}-${VARIANT}-${signing}.apk"
              # `path` came from a step whose cwd was apps/mobile/android.
              cp "android/$APK" "$out"
              # upload-artifact resolves `path` from the workspace root, not this
              # step's cwd, so the output has to be workspace-relative.
              echo "path=apps/mobile/$out" >> "$GITHUB_OUTPUT"
              echo "name=$out" >> "$GITHUB_OUTPUT"
              {
                 echo ""
                 echo "| | |"
                 echo "| --- | --- |"
                 echo "| file | \`${out}\` |"
                 echo "| version | ${version} |"
                 echo "| versionCode | ${code} |"
                 echo "| signing | ${signing} |"
                 echo "| API origin | ${EXPO_PUBLIC_API_URL} |"
                 echo "| size | $(du -h "$out" | cut -f1) |"
                 echo ""
                 if [ "$signing" = debug-key ]; then
                    echo "Debug-key signed: uninstall the EAS build first, Android will not accept a"
                    echo "changed signature as an update."
                 fi
              } >> "$GITHUB_STEP_SUMMARY"

         - name: Upload APK
           uses: actions/upload-artifact@v4
           with:
              name: rheoson-${{ env.VARIANT }}-apk
              path: ${{ steps.collect.outputs.path }}
              if-no-files-found: error
              retention-days: 30

         # `upload-artifact` does not expose a stable download URL, so the run
         # page is where the file is collected. Linking it saves hunting.
         - name: Point at the artifact
           if: always()
           run: |
              echo "Download: \`${{ steps.collect.outputs.name }}\` from" \
                 "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 >> "$GITHUB_STEP_SUMMARY"
