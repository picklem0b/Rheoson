name: Deploy GitHub Pages

on:
   push:
      branches: [main]
      paths:
         - "docs/**"
         - "README.md"
   workflow_dispatch:

# Only one deployment at a time — cancel in-flight if a new push comes in
concurrency:
   group: pages
   cancel-in-progress: true

permissions:
   contents: read
   pages: write
   id-token: write

jobs:
   deploy:
      runs-on: ubuntu-latest
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup Pages
           uses: actions/configure-pages@v5

         - name: Upload docs/ as Pages artifact
           uses: actions/upload-pages-artifact@v3
           with:
              # Serve everything inside docs/ — index.html is the entry point
              path: docs

         - name: Deploy to GitHub Pages
           id: deployment
           uses: actions/deploy-pages@v4
