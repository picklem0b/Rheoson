services:
  # ── Backend (FastAPI + Socket.IO) ───────────────────────────
  - type: web
    name: Rheoson-api
    env: python
    region: oregon
    plan: free
    rootDir: api

    # pip install -e . installs the package in editable mode from
    # pyproject.toml. No --break-system-packages — that flag is only
    # needed on Termux (Android) where pip protects the system Python.
    # On Render's isolated build environment it's unnecessary and can
    # cause warnings or failures depending on the base image.
    buildCommand: pip install -e .

    # Entry point is socket_app, NOT app — using `app` skips the
    # Socket.IO ASGI wrapper and breaks all real-time download events.
    startCommand: uvicorn app.main:socket_app --host 0.0.0.0 --port $PORT --workers 1 --log-level info

    # Render uses this to determine if the service is healthy after deploy.
    # If /api/health doesn't return 200, Render marks the deploy as failed.
    healthCheckPath: /api/health

    envVars:
      - key: ENV
        value: production

      # Render's free tier uses /tmp — files don't persist across restarts,
      # but it's fine for a self-hosted single-user setup.
      - key: MUSIC_DIR
        value: /tmp/Rheoson/music
      - key: DOWNLOADS_DIR
        value: /tmp/Rheoson/downloads

      # Set these in the Render dashboard — never commit credentials to git.
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

      # sync: false makes the Blueprint deploy prompt for these instead of
      # booting without them — validate_startup refuses to start in production
      # without a real SECRET_KEY and Clerk keys, so prompting here is the
      # difference between a working deploy and one that crash-loops.
      - key: SECRET_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false

      # Restrict CORS to the actual frontend origin. Origins are matched
      # exactly, so the scheme/host must be lowercase — browsers normalize
      # the Origin header and "https://Rheoson.onrender.com" would never match.
      # Update the URL if your Render service names differ.
      - key: CORS_ORIGINS
        value: '["https://rheoson.onrender.com","http://localhost:3000","http://localhost:5173"]'

  # ── Frontend (React / Vite SPA) ──────────────────────────────
  - type: web
    name: Rheoson
    env: static
    rootDir: web
    # verify:api-base fails the deploy if the bundle shipped a relative /api
    # (the same guard the APK CI runs) instead of deploying a player that
    # cannot reach the API.
    buildCommand: npm ci && npm run build && npm run verify:api-base
    staticPublishPath: dist

    # Redirect all routes to index.html so react-router handles
    # client-side routing correctly when refreshing on /library, etc.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Must match the actual API service URL — used at build time by Vite
      # to bake the correct API_BASE into the JS bundle.
      - key: VITE_API_URL
        value: https://rheoson-api-9e4c.onrender.com
      # Prompted at deploy time; without it the bundle ships in local mode
      # (no Clerk provider, every account feature silently unavailable).
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
