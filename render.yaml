services:
  # ── Backend (FastAPI + Socket.IO) ───────────────────────────
  - type: web
    name: Rheoson-api
    env: python
    region: oregon
    plan: free
    rootDir: api

    # pip install -e . installs the package in editable mode from
    # pyproject.toml. No --break-system-packages — that flag is only
    # needed on Termux (Android) where pip protects the system Python.
    # On Render's isolated build environment it's unnecessary and can
    # cause warnings or failures depending on the base image.
    buildCommand: pip install -e .

    # Entry point is socket_app, NOT app — using `app` skips the
    # Socket.IO ASGI wrapper and breaks all real-time download events.
    startCommand: uvicorn app.main:socket_app --host 0.0.0.0 --port $PORT --workers 1 --log-level info

    # Render uses this to determine if the service is healthy after deploy.
    # If /api/health doesn't return 200, Render marks the deploy as failed.
    healthCheckPath: /api/health

    envVars:
      - key: ENV
        value: production

      # Render's free tier uses /tmp — files don't persist across restarts,
      # but it's fine for a self-hosted single-user setup.
      - key: MUSIC_DIR
        value: /tmp/Rheoson/music
      - key: DOWNLOADS_DIR
        value: /tmp/Rheoson/downloads

      # Set these in the Render dashboard — never commit credentials to git.
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

      # Restrict CORS to the actual frontend origin.
      # Update the URL if your Render service names differ.
      - key: CORS_ORIGINS
        value: '["https://Rheoson.onrender.com","http://localhost:3000"]'

  # ── Frontend (React / Vite SPA) ──────────────────────────────
  - type: web
    name: Rheoson
    env: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    # Redirect all routes to index.html so react-router handles
    # client-side routing correctly when refreshing on /library, etc.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Must match the actual API service URL — used at build time by Vite
      # to bake the correct API_BASE into the JS bundle.
      - key: VITE_API_URL
        value: https://rheoson-api-vnny.onrender.com
